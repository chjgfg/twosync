[package]
name = "twosync"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
notify = "8.2.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
storage-engines = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
criterion = "0.5"

# `harness = false`：criterion 自己带 main，用 Rust 默认的测试 harness 会把这文件编成
# "没有基准"的空壳（criterion 0.5 与 libtest 的接口已经分家）。
[[bench]]
name = "m0"
harness = false
