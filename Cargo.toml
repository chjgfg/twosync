[package]
name = "twosync"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
notify = "8.2.0"
postcard = "1.1.3"
storage-engines = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
